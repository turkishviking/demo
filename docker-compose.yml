# `docker compose up --build` : Postgres + API + web.
#   web : http://<ip-de-la-machine>:3000     api : http://<ip-de-la-machine>:3001/api/docs
# En dev local (pnpm dev), ne lancer que la base : `docker compose up -d --wait postgres`.
# Démo sans authentification (ADR-0006) : à n'exposer que sur un réseau de confiance.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardsim
      POSTGRES_USER: cardsim
      POSTGRES_PASSWORD: cardsim
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardsim -d cardsim']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 120s

  api:
    build:
      context: .
      target: api
    image: cardsim-api
    environment:
      DATABASE_URL: postgres://cardsim:cardsim@postgres:5432/cardsim
      DATABASE_RUN_MIGRATIONS: 'true'
      LOG_LEVEL: info
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: cardsim-web
    environment:
      API_URL: http://api:3001/api/v1
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
